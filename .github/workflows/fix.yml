name: chg-fix-once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
      AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
      AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Разовый пакет «дожим Приедет» (12.11)
        run: python3 fix_priedet.py
