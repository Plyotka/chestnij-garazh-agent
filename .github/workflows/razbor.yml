name: chg-razbor

on:
  # Расписание СНЯТО 17.11: основной триггер — Яндекс-функция chg-pinger
  # (таймер chg-pinger-30m, кварц 0/30 9-20, дедуп по свежести прогона).
  # GH-cron два дня подряд молчал целыми окнами — пингер стабильнее.
  # workflow_dispatch оставлен для ручных запусков и отката.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true — без записи в amo, полный прогон на чтение)"
        required: false
        default: "false"
        type: string
      no_send:
        description: "NO_SEND (true — CRM разбираем, но клиенту не пишем)"
        required: false
        default: "false"
        type: string
      window_start:
        description: "Начало рабочего окна, МСК (по умолчанию 9:00)"
        required: false
        default: "9:00"
        type: string
      window_end:
        description: "Конец рабочего окна, МСК (по умолчанию 21:00 для чатов / 20:00 звонки)"
        required: false
        default: "20:00"
        type: string

permissions:
  contents: write  # шаг авитолога коммитит state.json (потерялось при правке on:, вернул)

jobs:
  razbor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
      AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      NO_SEND: ${{ github.event.inputs.no_send || 'false' }}
      WINDOW_START: ${{ github.event.inputs.window_start || '9:00' }}
      WINDOW_END: ${{ github.event.inputs.window_end || '20:00' }}
      KIMI_MODEL: kimi-k2.6
      MAX_LEADS_PER_RUN: "30"
      CHAT_WINDOW_DAYS: "3"
      MAX_CHATS_PER_RUN: "6"
    steps:
      - uses: actions/checkout@v4
      - name: Разбор звонков (ШАГ 0 + пропущенные + расшифровки Войси)
        run: python3 razbor.py | tee razbor.out
      - name: "Чат-контур Авито (после диалога Бадри — интерес → CRM + шаблон клиенту)"
        run: python3 chats.py | tee chats.out
      - name: Отчёт прогона в журнал CRM
        if: always()
        env:
          JOURNAL_LEAD_ID: "37575635"
        run: python3 journal.py
      - name: Авито-монитор (баланс, истечения, активация, аномалии) — был отдельным chg-avitolog-monitor
        if: always()
        run: python3 avitolog/monitor.py | tee avitolog/monitor.out
      - name: Сохранить состояние мониторинга
        if: always()
        run: |
          git config user.email "agent@chg.local"
          git config user.name "chg-agent"
          git add avitolog/state.json
          git diff --cached --quiet || git commit -m "avitolog: state $(date -u +%Y-%m-%dT%H:%M)"
          git push
