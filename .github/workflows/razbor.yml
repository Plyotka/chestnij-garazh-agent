name: chg-razbor

on:
  schedule:
    # 09:00–19:30 МСК (UTC+3) каждые 30 минут
    - cron: "*/30 6-16 * * *"
    # 19:57 МСК — последний вечерний прогон до дедлайна 20:00
    - cron: "57 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true — без записи в amo, полный прогон на чтение)"
        required: false
        default: "false"
        type: string
      no_send:
        description: "NO_SEND (true — CRM разбираем, но клиенту не пишем; вместо отправки — задача с текстом шаблона)"
        required: false
        default: "false"
        type: string
      window_start:
        description: "Начало рабочего окна, МСК (по умолчанию 9:00)"
        required: false
        default: "9:00"
        type: string
      window_end:
        description: "Конец рабочего окна, МСК (по умолчанию 20:00)"
        required: false
        default: "20:00"
        type: string

# прогоны не должны пересекаться: следующий ждёт завершения предыдущего
concurrency:
  group: chg-razbor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  razbor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
      AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      NO_SEND: ${{ github.event.inputs.no_send || 'false' }}
      WINDOW_START: ${{ github.event.inputs.window_start || '9:00' }}
      WINDOW_END: ${{ github.event.inputs.window_end || '20:00' }}
      KIMI_MODEL: kimi-k2.6
      MAX_LEADS_PER_RUN: "30"
      CHAT_WINDOW_DAYS: "3"
      MAX_CHATS_PER_RUN: "6"
    steps:
      - uses: actions/checkout@v4
      - name: Разбор звонков (ШАГ 0 + пропущенные + расшифровки Войси)
        run: python3 razbor.py
      - name: "Чат-контур Авито (после диалога Бадри — интерес → CRM + шаблон клиенту)"
        run: python3 chats.py
